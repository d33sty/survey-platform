upstream poll_backend {
    server web:8000;
}

# HTTP — только acme-challenge и редирект на HTTPS
server {
    listen 80;
    server_name 174-store.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 174-store.ru;

    ssl_certificate /etc/letsencrypt/live/174-store.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/174-store.ru/privkey.pem;

    charset utf-8;

    gzip on;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Голый домен -> /survey/
    location = / {
        return 301 /survey/;
    }

    # API под /survey/api/ -> FastAPI (срезаем префикс /survey/api/)
    location /survey/api/ {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://poll_backend/;
    }

    # SPA под /survey/ — статика, fallback на index.html
    location /survey/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /survey/index.html;
    }
}
